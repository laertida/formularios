<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Clase: Alta de Producto</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <form
      action="https://httpbin.org/post"
      method="POST"
      enctype="multipart/form-data"
    >
      <h1>Alta de Producto</h1>
      <p class="intro">
        Ingrese los datos técnicos para el registro del SKU en sistema.
      </p>

      <!-- 1. TEXTO -->
      <label for="nombre">Nombre del Producto</label>
      <input
        type="text"
        id="nombre"
        name="nombre_producto"
        placeholder="Ej. Zapatillas Running X1"
        required
      />

      <!-- 2. NÚMERO -->
      <label for="sku">ID de SKU</label>
      <input
        type="number"
        id="sku"
        name="sku_id"
        min="1000"
        max="9999"
        placeholder="1000 - 9999"
      />

      <!-- 3. EMAIL -->
      <label for="correo">Email del Solicitante</label>
      <input type="email" id="correo" name="email_contacto" />

      <!-- 4. FECHA -->
      <label for="fecha">Fecha de Lanzamiento</label>
      <input type="date" id="fecha" name="fecha_lanzamiento" />

      <!-- 5. SELECT -->
      <label for="cat">Categoría</label>
      <select id="cat" name="categoria">
        <option value="" disabled selected>-- Seleccione una opción --</option>
        <option value="ropa">Ropa y Accesorios</option>
        <option value="tecnologia">Tecnología</option>
        <option value="hogar">Hogar y Decoración</option>
      </select>

      <!-- 6. RADIO (Nacional / Importado) -->
      <label>Origen del Producto</label>

      <div class="opcion-inline">
        <input type="radio" id="nac_si" name="es_nacional" value="si" checked />
        <label class="label-opcion" for="nac_si">Nacional</label>
      </div>

      <div class="opcion-inline">
        <input type="radio" id="nac_no" name="es_nacional" value="no" />
        <label class="label-opcion" for="nac_no">Importado</label>
      </div>

      <!-- 7. CHECKBOX (Canales) -->
      <label>Canales de Venta</label>

      <div class="opcion-inline">
        <input type="checkbox" id="web" name="canal" value="web" />
        <label class="label-opcion" for="web">E-commerce</label>
      </div>

      <div class="opcion-inline">
        <input type="checkbox" id="app" name="canal" value="app" />
        <label class="label-opcion" for="app">App Móvil</label>
      </div>

      <div class="opcion-inline">
        <input type="checkbox" id="tienda" name="canal" value="tienda" />
        <label class="label-opcion" for="tienda">Tienda Física</label>
      </div>

      <!-- 8. FILE -->
      <label for="archivo">Ficha Técnica (PDF)</label>
      <input type="file" id="archivo" name="documento_adjunto" accept=".pdf" />

      <!-- 9. TEXTAREA -->
      <label for="obs">Observaciones Adicionales</label>
      <textarea id="obs" name="comentarios" rows="4"></textarea>

      <!-- BOTÓN -->
      <button type="submit">Registrar Producto</button>
    </form>
  </body>
</html>
